<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-copy="name"></title><style>:root {
  color-scheme: light;
  --bg: #f5f4f1; --surface: #fff; --ink: #252525; --muted: #73716e;
  --line: #d9d7d2; --green: #c63830; --soft: #eae8e3; --gold: #926900; --scene: #eeede8;
  font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  color: var(--ink); background: var(--bg);
}
:root.dark { color-scheme: dark; --bg: #202122; --surface: #28292a; --ink: #eeede9; --muted: #aba9a4; --line: #414243; --green: #f16c61; --soft: #353637; --gold: #e5bf61; --scene: #313333; }
@media(prefers-color-scheme:dark) { :root:not(.light) { color-scheme: dark; --bg: #202122; --surface: #28292a; --ink: #eeede9; --muted: #aba9a4; --line: #414243; --green: #f16c61; --soft: #353637; --gold: #e5bf61; --scene: #313333; } }
* { box-sizing: border-box; }
body { margin: 0; }
button, select, input { font: inherit; }
button, a, select { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 1px solid var(--ink); border-radius: 4px; background: var(--ink); color: var(--surface); padding: 8px 12px; font-weight: 600; }
button:hover { filter: brightness(.85); }
button:disabled { cursor: default; opacity: .4; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
button.secondary, button.quiet { background: transparent; color: var(--ink); border-color: var(--line); }
button.link { padding: 0; border: 0; background: none; color: var(--muted); font-weight: 400; text-align: left; }
a { color: inherit; }
input, select { border: 1px solid var(--line); border-radius: 3px; background: var(--surface); color: var(--ink); min-height: 36px; padding: 6px 9px; max-width: 100%; }
label { display: flex; flex-direction: column; gap: 5px; color: var(--muted); font-size: 11px; }
select, input { font-size: 13px; }
.shell { max-width: 1020px; margin: auto; padding: 0 clamp(16px, 3.5vw, 40px); border-top: 4px solid var(--green); }
.topbar { display: flex; align-items: center; gap: 16px; padding: 20px 0; }
.brand { display: flex; align-items: center; gap: 9px; font-size: 19px; font-weight: 780; letter-spacing: -.7px; text-decoration: none; white-space: nowrap; }
.brand-mark { position: relative; width: 23px; height: 23px; border: 2px solid var(--ink); border-radius: 50%; background: linear-gradient(var(--green) 45%, var(--ink) 45% 55%, var(--surface) 55%); }
.brand-mark::after { content: ''; position: absolute; width: 7px; height: 7px; border: 2px solid var(--ink); border-radius: 50%; background: var(--surface); left: 6px; top: 6px; }
.connection { margin-left: auto; font-size: 10px; color: var(--muted); }
.connection.live::before { content: ''; display: inline-block; width: 5px; height: 5px; background: #558065; margin-right: 6px; }
#refresh { font-size: 11px; padding: 5px 9px; }
nav { display: flex; gap: 26px; border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--muted); background: none; padding: 9px 0 12px; white-space: nowrap; font-size: 12px; font-weight: 500; }
nav button[aria-current=page] { color: var(--ink); border-bottom-color: var(--green); }
#notice:not(:empty) { padding: 8px 11px; margin-top: 14px; border-left: 3px solid var(--line); background: var(--soft); font-size: 12px; }
#notice.error { border-color: var(--green); color: var(--ink); }
main { padding: 22px 0 10px; min-height: 340px; }
.eyebrow { font: 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
h1 { font-size: 23px; letter-spacing: -.7px; line-height: 1.25; margin: 0 0 6px; font-weight: 700; }
h2 { font-size: 17px; letter-spacing: -.3px; margin: 0 0 5px; }
h3 { font-size: 14px; margin: 0; }
p { margin: 5px 0 13px; }
.muted, .intro { color: var(--muted); }
.intro { max-width: 640px; font-size: 12px; }
.small { font-size: 11px; }
.mono, .metric strong, .number { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-variant-numeric: tabular-nums; }
.metrics { display: flex; border-bottom: 1px solid var(--line); margin: 0 0 24px; padding: 0 0 18px; gap: 0; }
.metric { flex: 1; padding: 0 20px; border-left: 1px solid var(--line); }
.metric:first-child { padding-left: 0; border: 0; }
.metric strong { display: block; font-size: 22px; letter-spacing: -1px; font-weight: 500; margin-top: 4px; }
.metric span { color: var(--muted); font-size: 10px; }
.home-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 30px; align-items: start; }
.card { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; overflow: hidden; }
.pad { padding: 20px; }
.training-panel { border: 0; border-radius: 0; background: transparent; padding: 0; }
.scene { height: 240px; display: grid; place-items: center; position: relative; background: var(--scene); border-bottom: 1px solid var(--line); }
.scene::before { content: ''; position: absolute; inset: 18px; border: 1px solid var(--line); }
.scene img { width: 192px; height: 192px; image-rendering: pixelated; object-fit: contain; z-index: 1; }
.sprite-fallback { font-size: 54px; z-index: 1; }
.sprite-wrap { display: grid; place-items: center; min-height: 90px; }
.sprite-wrap img { width: 100px; height: 100px; object-fit: contain; image-rendering: pixelated; }
.sprite-wrap .sprite-fallback { font-size: 35px; }
.row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.badge { display: inline-block; font-size: 10px; padding: 2px 6px; border: 1px solid var(--line); color: var(--muted); border-radius: 2px; white-space: nowrap; }
.badge.shiny { color: var(--gold); }
.hero-name { font-size: 24px; margin: 4px 0 18px; }
progress { appearance: none; border: 0; border-radius: 0; background: var(--soft); height: 5px; width: 100%; overflow: hidden; display: block; margin: 8px 0; }
progress::-webkit-progress-bar { background: var(--soft); }
progress::-webkit-progress-value { background: var(--green); }
progress::-moz-progress-bar { background: var(--green); }
.mode-buttons { display: flex; margin: 15px 0 8px; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.mode-buttons button { flex: 1; padding: 7px 3px; font-size: 11px; border: 0; border-radius: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.mode-buttons button:last-child { border-right: 0; }
.mode-buttons button[aria-pressed=true] { background: var(--ink); color: var(--surface); }
.controls { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; margin-top: 18px; }
.xp { margin: 22px 0 16px; }
.ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; margin: 12px 0; }
.ev-grid .row { font-size: 10px; }
.ev-grid progress { height: 3px; margin: 4px 0 7px; }
.ev-grid progress::-webkit-progress-value { background: var(--muted); }
.ev-grid progress::-moz-progress-bar { background: var(--muted); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 17px; }
.filters { display: grid; grid-template-columns: minmax(100px,1fr) auto auto; gap: 12px; margin: 22px 0 12px; }
.collection-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(140px,1fr)); gap: 0; border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.pokemon { background: var(--surface); color: var(--ink); border: 0; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); text-align: left; padding: 13px; border-radius: 0; font-weight: 400; }
.pokemon:hover { background: var(--soft); filter: none; }
.pokemon strong { display: block; overflow-wrap: anywhere; font-size: 12px; }
.pokemon .row { font-size: 10px; margin-top: 4px; }
.pokemon .number { font-size: 10px; color: var(--muted); }
.empty { padding: 32px 18px; text-align: center; color: var(--muted); border: 1px solid var(--line); }
.section-heading { margin: 28px 0 12px; }
.shop-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(220px,1fr)); gap: 12px; }
.shop-card { display: flex; flex-direction: column; gap: 8px; }
.shop-card p { flex: 1; min-height: 45px; }
.item-icon { font-size: 26px; }
.shop-card button { font-size: 11px; }
.shop-card .actions { margin-top: 0; }
.inventory-label { font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--muted); }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; text-align: left; font-size: 11px; }
th { color: var(--muted); font-weight: 500; }
td, th { padding: 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td:first-child, th:first-child { padding-left: 0; }
.usage-grid { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; margin: 22px 0; }
.chart { display: flex; height: 135px; align-items: end; gap: 3px; margin-top: 22px; }
.bar { flex: 1; min-width: 3px; height: var(--height); background: var(--muted); }
.bar:hover { background: var(--green); }
.chart-legend { font-size: 10px; color: var(--muted); margin-top: 8px; }
.limit { margin: 18px 0; }
footer { border-top: 1px solid var(--line); padding: 18px 0 22px; margin-top: 20px; color: var(--muted); font-size: 10px; }
.footer-links { display: flex; gap: 18px; margin-bottom: 8px; }
.footer-links button { font-size: 11px; }
footer p { margin: 4px 0; }
dialog { color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 24px; width: min(470px, calc(100vw - 32px)); max-height: 90vh; overflow-y: auto; }
dialog::backdrop { background: #1118; }
.close { float: right; font-size: 11px; background: var(--soft); border: 0; color: var(--ink); }
.dialog-actions { display: flex; gap: 10px; justify-content: end; margin-top: 22px; }
dl { font-size: 11px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
dt { color: var(--muted); }
dd { margin: 0; overflow-wrap: anywhere; }
@media(max-width:640px) { .home-grid, .usage-grid { grid-template-columns: 1fr; } .scene { height: 195px; } .connection { max-width: 130px; } .topbar { gap: 10px; } .filters { grid-template-columns: 1fr 1fr; } .filters label:first-child { grid-column: 1 / -1; } }
@media(max-width:400px) { .topbar { flex-wrap: wrap; } .connection { order: 3; max-width: none; flex-basis: 100%; } .topbar #refresh { margin-left: auto; } nav { gap: 20px; } .metric { padding: 0 10px; } .metric strong { font-size: 20px; } .pad { padding: 16px; } .shop-grid { grid-template-columns: 1fr; } .controls { grid-template-columns: 1fr; } }
@media(prefers-reduced-motion:reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style></head>
<body><div class="shell">
<header class="topbar"><a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name" data-copy="name"></span></a>
<span id="connection" class="connection" role="status" data-copy="loading"></span><button id="refresh" class="quiet" data-copy="refresh"></button></header>
<nav aria-labelledby="brand-name"><button data-page="home" data-copy="home" aria-current="page"></button><button data-page="collection" data-copy="collection"></button><button data-page="activity" data-copy="activity"></button><button data-page="bag" data-copy="bag"></button></nav>
<div id="notice" role="status" aria-live="polite"></div>
<main id="main" aria-busy="true"><p class="empty" data-copy="loading"></p></main>
<footer><div class="footer-links"><button class="link" data-native="trade" data-copy="nativeTrade"></button><button class="link" data-native="settings" data-copy="nativeSettings"></button></div><p data-copy="footer"></p></footer>
</div><dialog id="details" aria-labelledby="detail-title"><button class="close" data-close="details" data-copy="close"></button><div id="detail-body"></div></dialog>
<dialog id="confirmation" aria-labelledby="confirm-title"><h2 id="confirm-title" data-copy="confirmTitle"></h2><p id="confirm-body"></p><div class="dialog-actions"><button data-close="confirmation" class="secondary" data-copy="cancel"></button><button id="confirm" data-copy="confirm"></button></div></dialog>
