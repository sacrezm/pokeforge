<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title data-copy="name"></title><style>/* STYLE */</style></head>
<body><div class="shell">
<header class="topbar"><a class="brand" href="#home"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name" data-copy="name"></span></a>
<span id="connection" class="connection" role="status" data-copy="loading"></span><button id="refresh" class="quiet" data-copy="refresh"></button></header>
<nav aria-labelledby="brand-name"><button data-page="home" data-copy="home" aria-current="page"></button><button data-page="collection" data-copy="collection"></button><button data-page="activity" data-copy="activity"></button><button data-page="bag" data-copy="bag"></button></nav>
<div id="notice" role="status" aria-live="polite"></div>
<main id="main" aria-busy="true"><p class="empty" data-copy="loading"></p></main>
<footer><div class="footer-links"><button class="link" data-native="trade" data-copy="nativeTrade"></button><button class="link" data-native="settings" data-copy="nativeSettings"></button></div><p data-copy="footer"></p></footer>
</div><dialog id="details" aria-labelledby="detail-title"><button class="close" data-close="details" data-copy="close"></button><div id="detail-body"></div></dialog>
<dialog id="confirmation" aria-labelledby="confirm-title"><h2 id="confirm-title" data-copy="confirmTitle"></h2><p id="confirm-body"></p><div class="dialog-actions"><button data-close="confirmation" class="secondary" data-copy="cancel"></button><button id="confirm" data-copy="confirm"></button></div></dialog>
<script type="module">/* APP */</script></body></html>
